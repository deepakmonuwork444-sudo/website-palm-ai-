<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    background: #0B0A1F; color: #F6F0E1;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; margin: 24px 0 8px; }
  .muted { color: #C3B9D8; font-size: 14px; }
  .card {
    background: #15132F; border: 1px solid rgba(230,184,92,0.28); border-radius: 16px;
    padding: 20px; margin: 20px 0;
  }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: #C3B9D8; }
  input {
    width: 100%; box-sizing: border-box; padding: 14px;
    background: #1C1942; color: #F6F0E1;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; font-size: 16px;
  }
  button {
    width: 100%; margin-top: 20px; padding: 16px;
    background: #E6B85C; color: #1F1300; border: 0; border-radius: 16px;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; }
  .status.show { display: block; }
  .ok { background: rgba(43,179,163,0.14); border: 1px solid #2BB3A3; }
  .err { background: rgba(255,92,92,0.14); border: 1px solid #FF5C5C; }
</style>
</head>
<body>
<main>
  <h1>Set a new password</h1>
  <p class="muted">{{BRAND}} · नया पासवर्ड बनाएँ</p>

  <div class="card">
    <p id="waiting" class="muted">Checking your reset link…</p>
    <form id="form" hidden>
      <label for="password">New password (at least 8 characters)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm">Type it again</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
      <button id="submit" type="submit">Save new password</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <p class="muted">When it is saved, go back to the app and sign in with the new password.</p>
</main>

<!-- Pinned and integrity-checked; hash verified against the npm package. -->
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
  integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP"
  crossorigin="anonymous"></script>
<script>
  // Filled in at deploy time. Only the publishable anon key belongs here.
  var SUPABASE_URL = window.SUPABASE_URL || '';
  var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';

  var form = document.getElementById('form');
  var waiting = document.getElementById('waiting');
  var button = document.getElementById('submit');
  var status = document.getElementById('status');

  function show(message, ok) {
    status.textContent = message;
    status.className = 'status show ' + (ok ? 'ok' : 'err');
  }

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    waiting.hidden = true;
    show('This page is not configured yet. Please contact us from the Google Play listing.', false);
  } else {
    // The emailed link carries a recovery session in the URL; the client
    // reads it and signs this page in for exactly one purpose.
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, persistSession: false },
    });

    var ready = false;
    client.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        ready = true;
        waiting.hidden = true;
        form.hidden = false;
        // Tokens should not linger in the address bar or history.
        history.replaceState(null, '', location.pathname);
      }
    });

    setTimeout(function () {
      if (!ready) {
        waiting.hidden = true;
        show('This link has expired or was already used. Request a new one from the app.', false);
      }
    }, 4000);

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      var password = document.getElementById('password').value;
      if (password.length < 8) return show('Passwords need to be at least 8 characters.', false);
      if (password !== document.getElementById('confirm').value) {
        return show('The two passwords do not match.', false);
      }

      button.disabled = true;
      var result = await client.auth.updateUser({ password: password });
      if (result.error) {
        show('We could not save that. The link may have expired — request a new one.', false);
        button.disabled = false;
        return;
      }
      await client.auth.signOut({ scope: 'local' });
      form.hidden = true;
      show('Saved. Go back to the app and sign in with your new password.', true);
    });
  }
</script>
</body>
</html>
